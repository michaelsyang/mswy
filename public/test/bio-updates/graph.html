    hoverSet = nb;
    const hover = nb.has.bind(nb);
    node.attr("opacity", dd => hover(dd.id) ? 1 : 0.18)
        .select("circle").attr("stroke-width", dd => dd.id === d.id ? 3 : 1.5);
    link.attr("opacity", e => hover(e.source.id) && hover(e.target.id) ? 1 : 0.05)
        .attr("stroke-width", e => (e.source.id===d.id||e.target.id===d.id) ? 2.5 : 1);
    refreshLabels(nb);
  });
  node.on("mouseout", function () { hoverSet = null; applyVisibility(activeTopic, currentQuery()); });
  node.on("click", function (event, d) { openPanel(d); });

  document.getElementById("search").addEventListener("input", function () {
    applyVisibility(activeTopic, this.value);
  });
  document.getElementById("isolate").addEventListener("click", clearIsolate);
  document.getElementById("closePanel").addEventListener("click", () =>
    document.getElementById("panel").classList.remove("open"));

  const legendList = document.getElementById("legendList");
  topics.forEach(t => {
    const li = document.createElement("div");
    li.className = "li";
    li.dataset.topic = t;
    li.innerHTML = `<span class="dot" style="background:${color[t]}"></span><span>${esc(t)}</span><span class="count">${tcount[t]||0}</span>`;
    li.onclick = () => activeTopic === t ? clearIsolate() : setTopic(t);
    legendList.appendChild(li);
  });

  function openPanel(d) {
    const el = document.getElementById("panel");
    const body = document.getElementById("panelBody");
    const neighbors = edges
      .filter(e => e.source.id === d.id || e.target.id === d.id)
      .map(e => e.source.id === d.id ? nodeById.get(e.target.id) : nodeById.get(e.source.id))
      .filter(Boolean);
    const tags = (d.topics||[]).map(t => `<span class="tag" style="border-color:${color[t]}">${esc(t)}</span>`).join("");
    body.innerHTML = `
      <div class="rank">RANK #${esc(String(d.rank))} · PMID ${esc(d.id)}</div>
      <h2>${esc(d.title)}</h2>
      <div class="meta">${esc(d.journal)} · IF ${esc(String(d.jif))} · ${esc(String(d.degree))} connections<br/>
        <a href="${esc(d.url)}" target="_blank" style="color:var(--accent)">Open on PubMed →</a></div>
      <div class="tags">${tags}</div>
      <div class="neighbors"><div class="meta" style="margin:0 0 6px">Connected papers (${neighbors.length})</div>
        ${neighbors.map(nb => `<div class="nb" data-id="${esc(nb.id)}">${esc(nb.title.slice(0,70))}</div>`).join("")}</div>`;
    body.querySelectorAll(".nb").forEach(div => {
      div.onclick = () => openPanel(nodeById.get(div.dataset.id));
    });
    el.classList.add("open");
  }

  function esc(s) {
    const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML;
  }

  // ---- topic cluster labels (layer under nodes) -------------------------------
  const clabel = g.append("g").style("pointer-events", "none");
  topics.forEach(t => {
    clabel.append("text")
      .attr("class", "clusterlabel")
      .attr("fill", color[t] || "#8b949e")
      .attr("text-anchor", "middle")
      .style("font-size", 13)
      .style("font-weight", 600)
      .style("letter-spacing", "0.2px")
      .style("opacity", 0.32)
      .text(t + " · " + (tcount[t]||0))
      .attr("transform", `translate(${centers[t].cx * W},${centers[t].cy * H})`);
  });

  sim.on("tick", draw);

  applyVisibility(null, "");

  function dragStarted(event, d) {
    if (!event.active) sim.alphaTarget(0.3).restart();
    d.fx = d.x; d.fy = d.y;
  }
  function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
  function dragEnded(event, d) {
    if (!event.active) sim.alphaTarget(0);
    d.fx = null; d.fy = null;
  }
  window.addEventListener("resize", () => {
    svg.attr("width", window.innerWidth).attr("height", window.innerHeight);
  });
})();
</script>
</body>
</html>
