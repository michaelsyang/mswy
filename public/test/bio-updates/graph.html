(function(){

  const color = DATA.color, topics = DATA.topics, tcount = DATA.topic_count;
  const svg = d3.select("#graph");
  const W = window.innerWidth, H = window.innerHeight;

  const nodeById = new Map(nodes.map(n => [n.id, n]));

    .force("y", d3.forceY(H / 2).strength(0.03));

    .style("opacity", 0.55);

  let activeTopic = null;
  const dmax2 = dmax;

  function applyVisibility(topicFilter, searchQuery) {
    const q = (searchQuery || "").toLowerCase();
    const show = new Set();
    nodes.forEach(n => {
      let ok = true;
      if (topicFilter && !n.topics.includes(topicFilter)) ok = false;
      if (ok && q) {
        ok = n.title.toLowerCase().includes(q) || n.journal.toLowerCase().includes(q)
           || n.id.includes(q) || n.topics.some(t => t.toLowerCase().includes(q));
      }
      if (ok) show.add(n.id);
    });
    node.attr("opacity", d => show.has(d.id) ? 1 : 0.12);
    link.attr("opacity", d => show.has(d.source.id) && show.has(d.target.id) ? 1 : 0.04);
  }

  function clearIsolate() {
    activeTopic = null;
    d3.select("#isolate").style("display", "none");
    document.querySelectorAll("#legendList .li").forEach(el => el.style.outline = "");
    applyVisibility(null, currentQuery());
  }

  function setTopic(t) {
    activeTopic = t;
    d3.select("#isolate").style("display", "inline-block");
    document.querySelectorAll("#legendList .li").forEach(el => {
      el.style.outline = el.dataset.topic === t ? "1px solid #58a6ff" : "";
    });
    applyVisibility(t, currentQuery());
  }

  function currentQuery() { return document.getElementById("search").value; }

  node.on("mouseover", function (event, d) {
    const nb = new Set([d.id]);
    edges.forEach(e => {
      if (e.source.id === d.id) nb.add(e.target.id);
      if (e.target.id === d.id) nb.add(e.source.id);
    });
    const hover = nb.has.bind(nb);
    node.attr("opacity", dd => hover(dd.id) ? 1 : 0.18)
        .select("circle").attr("stroke-width", dd => dd.id === d.id ? 3 : 1.5);
    link.attr("opacity", e => hover(e.source.id) && hover(e.target.id) ? 1 : 0.05)
        .attr("stroke-width", e => (e.source.id===d.id||e.target.id===d.id) ? 2.5 : 1);
  });
  node.on("mouseout", function () { applyVisibility(activeTopic, currentQuery()); });
  node.on("click", function (event, d) { openPanel(d); });

  document.getElementById("search").addEventListener("input", function () {
    applyVisibility(activeTopic, this.value);
  });
  document.getElementById("isolate").addEventListener("click", clearIsolate);
  document.getElementById("closePanel").addEventListener("click", () =>
    document.getElementById("panel").classList.remove("open"));

  const legendList = document.getElementById("legendList");
  topics.forEach(t => {
    const li = document.createElement("div");
    li.className = "li";
    li.dataset.topic = t;
    li.innerHTML = `<span class="dot" style="background:${color[t]}"></span><span>${esc(t)}</span><span class="count">${tcount[t]||0}</span>`;
    li.onclick = () => activeTopic === t ? clearIsolate() : setTopic(t);
    legendList.appendChild(li);
  });

  function openPanel(d) {
    const el = document.getElementById("panel");
    const body = document.getElementById("panelBody");
    const neighbors = edges
      .filter(e => e.source.id === d.id || e.target.id === d.id)
      .map(e => e.source.id === d.id ? nodeById.get(e.target.id) : nodeById.get(e.source.id))
      .filter(Boolean);
    const tags = (d.topics||[]).map(t => `<span class="tag" style="border-color:${color[t]}">${esc(t)}</span>`).join("");
    body.innerHTML = `
      <div class="rank">RANK #${esc(String(d.rank))} · PMID ${esc(d.id)}</div>
      <h2>${esc(d.title)}</h2>
      <div class="meta">${esc(d.journal)} · IF ${esc(String(d.jif))} · ${esc(String(d.degree))} connections<br/>
        <a href="${esc(d.url)}" target="_blank" style="color:var(--accent)">Open on PubMed →</a></div>
      <div class="tags">${tags}</div>
      <div class="neighbors"><div class="meta" style="margin:0 0 6px">Connected papers (${neighbors.length})</div>
        ${neighbors.map(nb => `<div class="nb" data-id="${esc(nb.id)}">${esc(nb.title.slice(0,70))}</div>`).join("")}</div>`;
    body.querySelectorAll(".nb").forEach(div => {
      div.onclick = () => openPanel(nodeById.get(div.dataset.id));
    });
    el.classList.add("open");
  }

  function esc(s) {
    const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML;
  }

  sim.on("tick", () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  });

  applyVisibility(null, "");

  function dragStarted(event, d) {
    if (!event.active) sim.alphaTarget(0.3).restart();
    d.fx = d.x; d.fy = d.y;
  }
  function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
  function dragEnded(event, d) {
    if (!event.active) sim.alphaTarget(0);
    d.fx = null; d.fy = null;
  }
  window.addEventListener("resize", () => {
    svg.attr("width", window.innerWidth).attr("height", window.innerHeight);
  });
